# Deploys the static build in dist/ to GitHub Pages on every push to main.
#
# The app is entirely client-side: Vite builds a static site, Pages serves it.
# There is no server, no API key and no database, so the site is free to host.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # allows a redeploy from the Actions tab without a new commit
  workflow_dispatch:

# least privilege: read the repo, write only the Pages site
permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; a newer push wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 7 needs Node 20.19+ or 22.12+
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify the build is not empty
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing - the build failed"; exit 1; }
          echo "pages: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
